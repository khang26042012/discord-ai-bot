  - cac lenh
  - huong dan lenh
  - menu
  - spawn
  - sethome
  - home
  - tpa
  - tpaccept
  content: '- /menu: Mở bảng Menu điều khiển trung tâm toàn bộ tính năng KhangSMP.

    - /spawn: Quay trở về sảnh chính trung tâm an toàn của thế giới.

    - /sethome <tên>: Đánh dấu vị trí nhà của bạn.

    - /home <tên>: Dịch chuyển tức thì về ngôi nhà đã lưu.

    - /tpa <tên>: Gửi yêu cầu dịch chuyển đến vị trí một người bạn.

    - /tpaccept: Đồng ý yêu cầu dịch chuyển của bạn bè.

    - /tpdeny: Từ chối dịch chuyển.

    - /pay <tên> <số_tiền>: Chuyển tiền trực tiếp cho người chơi khác.

    - /back: Dịch chuyển quay trở lại vị trí trước đó (hoặc vị trí vừa chết nếu có
    quyền).'
- id: rules_conduct
  title: Nội Quy & Luật Lệ Văn Minh KhangSMP
  aliases:
  - luat
  - noi quy
  - ban
  - kick
  - lua dao
  - hack
  - cheat
  - chui tuc
  - xuc pham
  content: '1. Nghiêm cấm tuyệt đối mọi hành vi sử dụng Hack, Cheat, X-Ray, Auto-Click
    quá mức, Bug Client gây mất cân bằng.

    2. Tôn trọng mọi thành viên, nghiêm cấm xúc phạm danh dự, phân biệt vùng miền,
    quấy rối, chửi bới vô văn hóa.

    3. Nghiêm cấm lừa đảo (scam) tài sản trong game hoặc giao dịch tiền thật ngoài
    đời.

    4. Tuyệt đối không quảng cáo server khác, không spam kênh chat.

    5. Mọi hành vi vi phạm sẽ bị xử lý nghiêm minh từ Cấm chat (Mute), Tù treo (Jail)
    đến Cấm vĩnh viễn (Ban IP/Hardware).'
- id: report_system
  title: Hệ Thống Tố Cáo & Báo Cáo Vi Phạm (/report)
