  title: Resource Pack Song Hành (PC Lunar & PE Bedrock)
  content: "Hệ thống Resource Pack KhangSMP hoạt động hoàn toàn tự động, siêu nhẹ\
    \ và đồng bộ đa nền tảng:\n• Bản PE (Bedrock / Điện thoại):\n  Đã được tối ưu\
    \ hóa cực đỉnh (chỉ còn 0.67 KB) và nạp sẵn trực tiếp vào Geyser (KhangSMP-Playlist-Bedrock.mcpack\
    \ v1.7.0). Người chơi vào bằng điện thoại kết nối tức thì, hiển thị chuẩn xác\
    \ mọi icon, badge, không bị lỗi font hay ô vuông.\n• Bản PC (Java / Lunar Client):\n\
    \  Dung lượng siêu nhẹ (chỉ 5.4 MB), tự động tải khi kết nối server. Đã gỡ bỏ\
    \ bài nhạc chiến trận nặng 20MB, giúp người chơi tải pack trong chớp mắt mà vẫn\
    \ thưởng thức trọn vẹn mô hình 3D vũ khí và âm thanh sắc nét."
