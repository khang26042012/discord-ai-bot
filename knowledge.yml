  title: Hệ Thống Bang Hội / Đội Nhóm (/team)
  content: 'Server sử dụng plugin BetterTeams để gắn kết anh em chiến hữu:

    - /team create <tên>   - Tạo một bang hội / team mới

    - /team invite <tên>   - Mời thành viên vào team

    - /team join <tên>     - Chấp nhận vào team

    - /team leave          - Rời khỏi team hiện tại

    - /team chat (hoặc /tc) - Chuyển sang kênh chat nội bộ team

    - /team pvp            - Bật hoặc tắt PvP giữa các thành viên trong team

    - /team info [tên]     - Xem thông tin chi tiết của team

    '
