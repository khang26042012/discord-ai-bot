  - dia chi
  - server
  - khangsmp
  - thong tin
  - phien ban
  - java
  - bedrock
  - pe
  - ket noi
  content: '- Tên Server: KhangSMP (Cộng đồng Sinh Tồn Minecraft Việt Nam hàng đầu).

    - Địa chỉ IP: ripple.pikamc.vn

    - Port máy chủ: 25084 (Áp dụng cho CẢ JAVA LẪN BEDROCK/PE ĐIỆN THOẠI).

    - Phiên bản hỗ trợ: Paper 1.21.4 gốc (Tương thích tất cả client từ 1.16 đến 1.21.x
    mới nhất qua ViaVersion/ViaBackwards).

    - Nền tảng: Đa nền tảng PC (Java) và Mobile/Console (Bedrock/PE qua Geyser & Floodgate).

    - Chủ sở hữu / Owner: khangmc_vn (Anh Khang).

    - Quản trị viên danh dự: FrogyGreen (Chị nhà).

    - Trợ lý AI độc quyền: Jet Jet bi sun rang 🐭.

    - Discord chính thức: https://discord.gg/4afmVDmy2

    - TikTok Owner: @phantrongkhangg'
- id: resource_pack
  title: Hệ Thống Gói Tài Nguyên Song Hành (Resource Pack)
  aliases:
  - pack
  - resource pack
  - tai nguyen
  - texture
  - bi kick vi pack
  - loi pack
  - bat pack
  - geyser pack
  content: "- Java (PC): BẮT BUỘC TẢI TÀI NGUYÊN để tham gia server (hỗ trợ nghe 17\
    \ bài nhạc /nhac, vũ khí Thánh Kiếm Excalibur 3D và icon giao diện chuẩn đẹp).\n\
    \  + Hướng dẫn khi bị từ chối/bị kick: Ra ngoài màn hình danh sách Server -> Chọn\
    \ KhangSMP -> Bấm 'Sửa' (Edit) -> Chuyển 'Gói tài nguyên máy chủ' (Server Resource\
    \ Packs) sang 'Bật' (Enabled) hoặc 'Hỏi' (Prompt) -> Đăng nhập lại.\n- Bedrock/PE\
    \ (Điện thoại): Đã được tối ưu tự động nạp gói KhangSMP_Geyser.mcpack siêu nhẹ,\
    \ không bị kick, không bị đơ giật thiết bị.\n- Âm thanh & Model 3D: Cung cấp trải\
    \ nghiệm thị giác và thính giác độc quyền của KhangSMP."
- id: realping_system
  title: Hệ Thống Đo & Hiển Thị Ping Thực Tế 100% (%realping_ping%)
  aliases:
  - ping
  - lag
  - ms
  - do tre
  - mang yeu
  - mat mang
  - disconect
  - scoreboard ping
  - tab ping
  content: "- KhangSMP sở hữu công nghệ đo Ping độc quyền tích hợp trong DiscordBridge\
    \ (%realping_ping%):\n  + Người chơi Bedrock/PE: Đo trực tiếp độ trễ gói tin RakNet\
    \ UDP hai chiều giữa điện thoại và máy chủ. Hiển thị chuẩn xác từng ms (thường\
    \ dao động 30ms - 60ms trên mạng 4G/Wifi tốt).\n  + Người chơi Java/PC: Đo độ\
    \ trễ TCP thực tế chuẩn xác.\n- Vị trí hiển thị: Scoreboard bên phải màn hình,\
    \ Bảng TAB (nhấn giữ TAB), và Belowname (dưới tên nhân vật).\n- Khắc phục lỗi\
    \ giật lag: Server đã tối ưu MTU 1350 và cơ chế chống timeout riêng biệt, chấm\
    \ dứt hoàn toàn tình trạng nhảy ping ảo 1000ms hay văng mạng trước đây."
- id: skin_system
  title: Hệ Thống Skin Đa Dạng & Avatar Webhook (/skin)
  aliases:
  - skin
  - doi skin
  - trang phuc
  - ngoai hinh
  - skinsrestorer
  - avatar
  - avatar discord
  content: "- Đổi skin dễ dàng: Cả người chơi Java lẫn Bedrock/PE đều có thể dùng\
    \ lệnh /skin để thay đổi ngoại hình theo ý thích:\n  + /skin <tên_người_chơi>:\
    \ Áp dụng skin của một tài khoản bản quyền bất kỳ.\n  + /skin url <đường_dẫn_ảnh>:\
    \ Nạp skin tùy chỉnh từ link ảnh PNG.\n  + /skin update: Làm mới và đồng bộ skin\
    \ của bạn ngay lập tức.\n  + /skin clear: Trở về skin mặc định ban đầu.\n- Đồng\
    \ bộ Avatar Discord: Hệ thống DiscordBridge đã được tối ưu hóa toàn diện, nhận\
    \ diện hoàn hảo các loại skin Marketplace/Persona của PE, hiển thị avatar sắc\
    \ nét trên Discord mà không bị lỗi méo ảnh 2D."
- id: game_modes_scope
  title: Chế Độ Chơi KhangSMP & Những Gì Server KHÔNG CÓ (Lá Chắn Chống Ảo Giác)
  aliases:
  - che do choi
  - survival
  - oneblock
  - skyblock
  - bedwars
  - skywars
  - prison
  - gens
  - boxpvp
  - the loai
  content: '- CHẾ ĐỘ DUY NHẤT: KhangSMP là máy chủ SINH TỒN THUẦN TÚY (Survival SMP
    / Vanilla+).

    - KHÔNG CÓ BẤT KỲ CHẾ ĐỘ NÀO KHÁC: Tuyệt đối KHÔNG CÓ OneBlock (1 block), KHÔNG
    CÓ SkyBlock, KHÔNG CÓ Bedwars, KHÔNG CÓ Skywars, KHÔNG CÓ Prison, KHÔNG CÓ Gens,
    KHÔNG CÓ BoxPvP!

    - NGUYÊN TẮC TRẢ LỜI: Nếu người chơi hỏi server có OneBlock, SkyBlock hay Bedwars
    không, phải khẳng định DỨT KHOÁT và RÕ RÀNG là máy chủ KHÔNG CÓ, server chỉ tập
    trung xây dựng thế giới Sinh Tồn chân thực nhất!'
- id: mechanics_farms
  title: Cơ Chế Farm, Chăn Nuôi & Nông Nghiệp
  aliases:
  - farm
  - ap trung
  - trung ga
  - may ap trung
  - spawner
  - chan nuoi
  - trong trot
  - hopper
  content: "- Cơ chế thuần Minecraft Vanilla 1.21.4:\n  + Động vật sinh sản tự nhiên\
    \ khi được cho ăn hạt giống/lúa mì/cà rốt.\n  + Người chơi tự do thiết kế máy\
    \ farm thủ công bằng nước, phễu (hopper), đá đỏ chuẩn cơ chế game gốc.\n- CẢNH\
    \ BÁO TÍNH NĂNG ẢO: Server KHÔNG CÓ 'máy ấp trứng tự động', không có menu bán\
    \ trứng tự nở ảo diệu. Mọi hoạt động sinh sản đều dựa trên luật vật lý và sinh\
    \ học của Minecraft gốc."
- id: than_khi_weapons
  title: Hệ Thống Thần Khí & Vũ Khí Huyền Thoại KhangSMP
  aliases:
  - than khi
  - vu khi
  - excalibur
  - thanh kiem
  - kiem kaz
  - dai dao
  - do cua sun
  content: "- Các món Thần Khí tối thượng trên server:\n  + Thánh Kiếm Excalibur:\
    \ Mô hình 3D Hoàng Kim độc quyền, hiệu ứng hào quang rực rỡ, sát thương sấm sét\
    \ cuồng nộ.\n  + Đại Đao: Uy lực chém diện rộng uy mãnh.\n  + Kiếm Kaz: Kiếm sắc\
    \ bén với tốc độ xuất chiêu kinh hoàng.\n  + Đồ Của Sún: Bộ giáp và trang bị đặc\
    \ biệt của gia tộc.\n- Cơ chế bảo vệ Thần Khí: Thần khí được bảo vệ chống mất\
    \ cắp, chống rớt đồ bất cẩn và chỉ những chiến binh xứng đáng mới có thể sở hữu."
- id: music_system
  title: Studio Âm Nhạc KhangSMP (/nhac)
  aliases:
  - nhac
  - am nhac
  - lofi
  - bai hat
  - nghe nhac
  - tat nhac
  - sound
  content: '- Lệnh kích hoạt: /nhac

    - Tính năng: Mở giao diện Studio Âm Nhạc KhangSMP với tuyển tập 17 bài hát Lofi
    TikTok & Gaming cực chill được tinh chỉnh tần số âm thanh hoàn hảo.

    - Cơ chế: Phát nhạc cá nhân hoặc chia sẻ không gian âm nhạc thư giãn trong lúc
    sinh tồn, xây dựng nhà cửa, đào quặng cùng bạn bè.

    - Điều kiện: Cần bật Resource Pack để nghe được toàn bộ danh sách 17 bài hát.'
- id: patpat_system
  title: Tính Năng Xoa Đầu Hoạt Hình Đáng Yêu (/patpat)
  aliases:
  - patpat
  - xoa dau
  - cung chieu
  - hoat hinh
  - pat
  content: '- Lệnh kích hoạt: /patpat <tên_người_chơi>

    - Trải nghiệm: Hiển thị hoạt ảnh xoa đầu 5 frame hoạt hình siêu dễ thương trên
    đầu người được xoa, kèm âm thanh vui nhộn.

    - Ý nghĩa: Dùng để bày tỏ tình cảm, cưng chiều bạn bè, dỗ dành đồng đội khi mệt
    mỏi trong hành trình sinh tồn.'
- id: team_clan
  title: Hệ Thống Bang Hội & Đồng Đội (/team)
  aliases:
  - team
  - bang hoi
  - clan
  - doi
  - nhom
  - tao team
  - moi team
  content: "- Plugin quản lý: BetterTeams\n- Lệnh chính: /team\n- Các thao tác bang\
    \ hội tiêu biểu:\n  + /team create <tên>: Thành lập bang hội mới của riêng bạn.\n\
    \  + /team invite <tên>: Mời bạn bè tham gia bang hội.\n  + /team accept / deny:\
    \ Chấp nhận hoặc từ chối lời mời gia nhập.\n  + /team leave: Rời khỏi bang hội\
    \ hiện tại.\n  + /team chat: Kênh trò chuyện nội bộ bí mật chỉ thành viên trong\
    \ bang mới thấy.\n  + /team sethome / home: Đặt và dịch chuyển về căn cứ chung\
    \ của bang hội.\n  + /team pvp: Bật/tắt chế độ tự gây sát thương giữa các thành\
    \ viên cùng team."
- id: claim_griefprevention
  title: Bảo Vệ Đất Đai & Tài Sản Bằng Xẻng Vàng (Claim)
  aliases:
  - claim
  - xeng vang
  - bao ve dat
  - khoa dat
  - trust
  - untrust
  - pha hoai
  - chong trom
  content: "- Công cụ Claim: Xẻng Vàng (Golden Shovel).\n- Cách Claim đất an toàn:\n\
    \  1. Cầm Xẻng Vàng trên tay, click chuột phải vào góc thứ nhất của khu đất.\n\
    \  2. Di chuyển sang góc đối diện xéo góc và click chuột phải lần thứ hai để hoàn\
    \ tất tạo vùng bảo vệ.\n- Lệnh cấp quyền cho bạn bè:\n  + /trust <tên>: Cấp quyền\
    \ xây dựng, đào bới và mở rương trong đất của bạn.\n  + /containertrust <tên>:\
    \ Chỉ cho phép mở rương, lò nung, thùng chứa mà không được đập phá block.\n  +\
    \ /accesstrust <tên>: Cho phép bấm nút, gạt cần, mở cửa đi lại.\n  + /untrust\
    \ <tên>: Thu hồi toàn bộ quyền đã cấp.\n  + /abandonclaim: Hủy bỏ khu đất đang\
    \ đứng để lấy lại khối claim.\n- Mẹo: Càng chơi lâu trên server, bạn càng tích\
    \ lũy được nhiều khối claim (Claim Blocks)."
- id: newbie_protection
  title: Chế Độ Bảo Vệ Tân Thủ 60 Phút (/baove)
  aliases:
  - baove
  - tan thu
  - nguoi moi
  - bao ve 60p
  - chong pvp tan thu
  content: '- Tự động kích hoạt: Ngay khi người chơi mới bước chân vào KhangSMP, hệ
    thống tự động bật chế độ bảo vệ kéo dài 60 phút.

    - Quyền lợi: Miễn nhiễm hoàn toàn với sát thương PvP từ người chơi khác, tránh
    bị những người chơi cũ tấn công khi chưa có trang bị.

    - Lệnh kiểm tra: /baove (xem thời gian bảo vệ còn lại hoặc tự nguyện tắt bảo vệ
    sớm nếu muốn tham gia PvP).'
- id: choden_auctionhouse
  title: Sàn Đấu Giá & Chợ Đen Người Chơi (/ah, /choden)
  aliases:
  - ah
  - choden
  - dau gia
  - cho den
  - ban do cho nguoi choi
  - mua do
  content: "- Lệnh kích hoạt: /ah hoặc /choden\n- Chức năng: Sàn giao dịch tự do giữa\
    \ tất cả cư dân máy chủ:\n  + /ah: Mở giao diện Chợ Đen để duyệt mua hàng ngàn\
    \ vật phẩm, khoáng sản, trang bị độc lạ do người chơi khác đăng bán.\n  + /ah\
    \ sell <giá>: Cầm vật phẩm trên tay và gõ lệnh để đăng bán lên chợ.\n  + Đấu giá\
    \ & Nhận tiền: Tiền bán vật phẩm sẽ được tự động cộng thẳng vào tài khoản của\
    \ bạn ngay khi có người mua, kể cả khi bạn đang offline!"
- id: economy_shop
  title: Cửa Hàng Nhà Nước /shop & Rương Bán Nhanh /sellgui
  aliases:
  - shop
  - cua hang
  - sellgui
  - ban do nhanh
  - kiem tien
  - kinh te
  - tien
  content: '- Cửa hàng chính: /shop - Mua bán nông sản, khối xây dựng, công cụ, thuốc
    men với giá niêm yết của máy chủ.

    - Bán đồ nhanh siêu tiện lợi: /sellgui - Mở một rương ảo, chỉ cần ném toàn bộ
    đồ nông nghiệp, quặng khoáng sản muốn thanh lý vào rương rồi đóng lại -> Toàn
    bộ đồ sẽ được tự động quy đổi thành tiền mặt ngay lập tức!

    - Kiểm tra số dư: /money hoặc xem trực tiếp trên Scoreboard bên phải màn hình.'
- id: daily_rewards
