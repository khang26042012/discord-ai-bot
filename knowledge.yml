  content: 'Nghiêm cấm:

    • Hack / Cheat / Client bất hợp pháp

    • Bug Abuse, Duplication, Grief

    • Spam chat, chửi thề tục tĩu (bị Thiên Kiếp Sấm Sét 1 phút!)

    • Quảng cáo server khác

    • Bắt nạt tân thủ / người mới

    • Lừa đảo, chiếm đoạt tài sản


    Vi phạm: cảnh cáo → mute → kick → ban.

    '
