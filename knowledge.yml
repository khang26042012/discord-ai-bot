      - cưa cây

    title: Chặt Cây Nhanh (/timber)

    content: |
      Chặt cả cây chỉ bằng 1 nhát rìu (tối đa 30 block gỗ).
      Rìu hao mòn tương ứng với số gỗ bị phá.

      Bật/tắt: /timber hoặc /chatcay

  # ==================================================
  # 11. BÁO CÁO VI PHẠM
  # ==================================================

  - id: report
    aliases:
      - report
      - báo cáo
      - tố cáo
      - vi phạm

    title: Báo Cáo Vi Phạm (/report)

    content: |
      /report <tên người chơi> <lý do>

      Ví dụ: /report PE_xxx hack speed

      Thông báo ngay đến Admin online, được lưu lại để Admin xem bằng /reports.

  # ==================================================
  # 12. REDEEM CODE
  # ==================================================

  - id: redeem
    aliases:
      - redeem
      - code
      - mã thưởng
      - denbu
      - quà code

    title: Redeem Code (Mã Thưởng)

    content: |
      /redeem denbu2 - 32 Kim Cương, 4 Netherite Scrap, 3 Táo Vàng, 64 Tên Lửa, 30 Level, +50,000$
      /redeem denbu3 - +800 Claim Blocks

      Mỗi code chỉ dùng 1 lần / người. Theo dõi Discord để nhận code mới.

  # ==================================================
  # 13. FAQ
  # ==================================================

  - id: faq
    aliases:
      - faq
      - câu hỏi thường gặp
      - lỗi
      - không được
      - tại sao

    title: FAQ - Câu hỏi thường gặp

    content: |
      Không phá được block?
      → Bạn đang ở Spawn hoặc trong Claim của người khác.

      Không mở được rương / cửa?
      → Chưa được chủ Claim cấp quyền /containertrust hoặc /accesstrust.

      Không Claim được?
      → Claim bị chồng, ở vùng cấm, hoặc hết claim blocks. Kiểm tra: /claimslist

      Có mất đồ khi chết không?
      → CÓ. Server KHÔNG có Keep Inventory. Hãy cẩn thận!

      Bị người khác đánh khi mới vào?
      → /baove để xem thời gian bảo vệ tân thủ còn lại.

      Shop ở đâu?
      → Chưa có NPC Shop. Dùng /tx để chơi Tài Xỉu kiếm tiền!

      Cần hỗ trợ?
      → Discord: https://discord.gg/4afmVDmy2

  # ==================================================
  # 14. NỘI QUY
  # ==================================================

  - id: rules
    aliases:
      - nội quy
      - rules
      - hack
      - cheat
      - vi phạm
      - cấm

    title: Nội quy Server

    content: |
      Nghiêm cấm:
      • Hack / Cheat / Client bất hợp pháp
      • Bug Abuse, Duplication, Grief
      • Spam chat, chửi thề tục tĩu (bị Thiên Kiếp Sấm Sét 1 phút!)
      • Quảng cáo server khác
      • Bắt nạt tân thủ / người mới
      • Lừa đảo, chiếm đoạt tài sản

      Vi phạm: cảnh cáo → mute → kick → ban.

