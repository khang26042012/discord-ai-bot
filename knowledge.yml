  title: Hướng dẫn người chơi mới
  content: 'Khi mới vào server lần đầu, bạn sẽ nhận được:

    - Chào mừng trang trọng toàn server + pháo hoa

    - Hướng dẫn lệnh hữu ích gửi riêng


    Bảo vệ tân thủ (60 phút đầu):

    - Bạn KHÔNG thể bị PvP trong 60 phút đầu tiên

    - Dùng /baove để xem thời gian bảo vệ còn lại


    Bước bắt đầu:

    1. Dùng /redeem denbu2 và /redeem denbu3 để nhận quà tân thủ + 800 claim blocks

    2. Dùng /rtp để dịch chuyển ngẫu nhiên ra ngoài Spawn

    3. Xây nhà, dùng Xẻng Vàng Claim đất để bảo vệ

    4. Đặt /sethome để về nhà nhanh

    5. Gõ /daily để nhận quà hằng ngày (Kim Cương, Tiền, Táo Vàng...)

    6. Mở /menu để xem tất cả tính năng


    Lưu ý quan trọng:

    - Claim blocks ban đầu: 800 (từ redeem) + tích lũy theo thời gian chơi

    - Rank chỉ do Admin cấp, không thể mua

    - Server KHÔNG có Keep Inventory (cẩn thận khi chết!)

    - Cooldown lệnh dịch chuyển: 3 giây

    '
