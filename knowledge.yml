  title: Claim đất (GriefPrevention)
  content: 'Server sử dụng plugin GriefPrevention để bảo vệ đất đai.


    Cách tạo Claim:

    - Cầm Xẻng Vàng (Golden Shovel)

    - Chuột phải vào hai góc đối diện của khu vực cần bảo vệ


    Claim Blocks:

    - Nhận 800 blocks từ /redeem denbu2 + /redeem denbu3

    - Tích lũy thêm theo thời gian chơi online


    Các lệnh quản lý:

    /trust <tên>           - Cho phép xây dựng

    /untrust <tên>         - Thu hồi quyền

    /accesstrust <tên>     - Cho phép dùng cửa, nút

    /containertrust <tên>  - Cho phép mở rương

    /trustlist             - Xem danh sách quyền

    /abandonclaim          - Xóa Claim đang đứng

    /abandonallclaims      - Xóa toàn bộ Claim

    /claimslist            - Xem số blocks đã dùng/còn lại

    '
