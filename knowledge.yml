  title: Plugin đang sử dụng
  content: 'Server Paper 1.21.4, Bedrock/PE qua Geyser + Floodgate.


    Tính năng & Plugin nổi bật:

    - MusicKhangSMP: Hệ thống nhạc nền tự động 15 bài xoay vòng liên tục toàn server
    (/nhac, /nhacad).

    - zAuctionHouseV3: Sàn giao dịch Chợ Đen tự do giữa người chơi (/ah, /choden).

    - EconomyShopGUI-Premium: Cửa hàng /shop và rương bán nhanh /sellgui (Dynamic
    Pricing tự động hồi giá mỗi 3 phút).

    - GriefPrevention: Claim đất chống phá hoại bằng Xẻng Vàng.

    - VeinMiner: Đào quặng nhanh cả cụm (/vm).

    - Tài Xỉu 1 Chạm (/tx).

    - Điểm Danh Hằng Ngày (/daily).

    - Bảo Vệ Tân Thủ 60 phút (/baove).

    - Chặt Cây Nhanh (/timber).

    - 1 Người Ngủ Qua Đêm.

    - Thiên Kiếp Sấm Sét (chống chửi thề).

    - Báo Cáo Vi Phạm (/report).

    - Redeem Code (/redeem).

    - GrimAC (Anti-cheat), LuckPerms, TAB, DriveBackupV2...'
