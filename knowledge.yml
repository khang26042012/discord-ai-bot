  title: Chế Độ Chơi KhangSMP & Những Gì Server KHÔNG CÓ
  content: 'CHẾ ĐỘ CHƠI DUY NHẤT:

    - KhangSMP là máy chủ SINH TỒN (Survival SMP / Vanilla+) thuần túy trên Paper
    1.21.4.

    - Lối chơi tập trung vào: Khám phá thế giới rộng lớn, đào khoáng sản, xây dựng
    công trình, bảo vệ đất đai bằng Xẻng Vàng (/claim), kết nối bang hội (/team),
    chặt cây nhanh (/timber), và thư giãn cùng Studio Nhạc Lofi (/nhac).


    NHỮNG CHẾ ĐỘ MÁY CHỦ TUYỆT ĐỐI KHÔNG CÓ:

    - KHÔNG CÓ OneBlock (Server không có map 1 block nào cả).

    - KHÔNG CÓ SkyBlock (Không có đảo trên trời).

    - KHÔNG CÓ Bedwars, Skywars, Eggwars hay các minigame đối kháng.

    - KHÔNG CÓ Prison, Gens, BoxPvP hay Towny riêng biệt.


    QUY TẮC PHẢN HỒI:

    Nếu ai hỏi server có OneBlock, SkyBlock, Bedwars hay mini-game nào không:

    Khẳng định dứt khoát: "KhangSMP là máy chủ Sinh Tồn (Survival SMP) thuần túy,
    hiện tại KHÔNG CÓ chế độ [X] nha bạn! Server tập trung trải nghiệm sinh tồn, xây
    dựng cày cuốc, bảo vệ đất và lập team /team chiến đấu cùng bạn bè."

    '
