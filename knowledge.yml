  # ==================================================
  # 2. HƯỚNG DẪN NGƯỜI CHƠI MỚI
  # ==================================================

  - id: getting_started
    aliases:
      - newbie
      - người mới
      - tân thủ
      - bắt đầu
      - hướng dẫn
      - chơi như thế nào
      - kit
      - mới vào

    title: Hướng dẫn người chơi mới

    content: |
      Khi mới vào server lần đầu, bạn sẽ nhận được:
      - Chào mừng trang trọng toàn server + pháo hoa
      - Hướng dẫn lệnh hữu ích gửi riêng

      Bảo vệ tân thủ (60 phút đầu):
      - Bạn KHÔNG thể bị PvP trong 60 phút đầu tiên
      - Dùng /baove để xem thời gian bảo vệ còn lại

      Bước bắt đầu:
      1. Dùng /redeem denbu2 và /redeem denbu3 để nhận quà tân thủ + 800 claim blocks
      2. Dùng /rtp để dịch chuyển ngẫu nhiên ra ngoài Spawn
      3. Xây nhà, dùng Xẻng Vàng Claim đất để bảo vệ
      4. Đặt /sethome để về nhà nhanh
      5. Gõ /daily để nhận quà hằng ngày (Kim Cương, Tiền, Táo Vàng...)
      6. Mở /menu để xem tất cả tính năng

      Lưu ý quan trọng:
      - Claim blocks ban đầu: 800 (từ redeem) + tích lũy theo thời gian chơi
      - Rank chỉ do Admin cấp, không thể mua
      - Server KHÔNG có Keep Inventory (cẩn thận khi chết!)
      - Cooldown lệnh dịch chuyển: 3 giây

  # ==================================================
  # 3. CÁC LỆNH CƠ BẢN
  # ==================================================

  - id: commands
    aliases:
      - command
      - commands
      - lệnh
      - help
      - lệnh gì

    title: Các lệnh cơ bản

    content: |
      === Menu chính ===
      /menu             - Mở bảng điều khiển nhanh (GUI)

      === Dịch chuyển ===
      /spawn            - Về Spawn
      /rtp              - Dịch chuyển ngẫu nhiên (Overworld)
      /home [tên]       - Về Home
      /homes            - Xem danh sách Home
      /sethome [tên]    - Đặt Home
      /delhome [tên]    - Xóa Home
      /back             - Quay lại vị trí vừa chết

      === TPA ===
      /tpa <tên>        - Gửi yêu cầu dịch chuyển
      /tpaccept         - Chấp nhận
      /tpdeny           - Từ chối

      === Tiện ích ===
      /msg <tên>        - Nhắn tin riêng
      /reply            - Trả lời người vừa nhắn
      /daily            - Nhận quà hằng ngày
      /tx               - Sòng bạc Tài Xỉu 1 chạm
      /baove            - Xem trạng thái bảo vệ tân thủ
      /report <tên> <lý do> - Báo cáo người vi phạm
      /timber           - Bật/tắt chặt cả cây 1 nhát
      /sb               - Bật/tắt bảng điểm Scoreboard

  # ==================================================
  # 4. CLAIM ĐẤT
  # ==================================================

  - id: claim
    aliases:
      - claim
      - grief
      - griefprevention
      - xẻng vàng
      - golden shovel
      - bảo vệ đất
      - claimslist
      - claim block

    title: Claim đất (GriefPrevention)

    content: |
      Server sử dụng plugin GriefPrevention để bảo vệ đất đai.

      Cách tạo Claim:
      - Cầm Xẻng Vàng (Golden Shovel)
      - Chuột phải vào hai góc đối diện của khu vực cần bảo vệ

      Claim Blocks:
      - Nhận 800 blocks từ /redeem denbu2 + /redeem denbu3
      - Tích lũy thêm theo thời gian chơi online

      Các lệnh quản lý:
      /trust <tên>           - Cho phép xây dựng
      /untrust <tên>         - Thu hồi quyền
      /accesstrust <tên>     - Cho phép dùng cửa, nút
      /containertrust <tên>  - Cho phép mở rương
      /trustlist             - Xem danh sách quyền
      /abandonclaim          - Xóa Claim đang đứng
      /abandonallclaims      - Xóa toàn bộ Claim
      /claimslist            - Xem số blocks đã dùng/còn lại

  # ==================================================
  # 5. RANK
  # ==================================================

  - id: ranks
    aliases:
      - rank
      - cấp bậc
      - lên rank
      - thăng cấp

    title: Rank trên KhangSMP

    content: |
      Các rank hiện tại:
      • Member   - Rank mặc định khi vào server
      • Admin    - Quản trị viên
      • Owner    - Chủ server (Phan Trọng Khang)

      Rank đặc biệt (do Admin cấp tay):
      Manager, Famous, Discord, Helper, TheEgg

      Lưu ý:
      - Rank chỉ do Owner/Admin cấp trực tiếp
      - Không thể mua Rank bằng tiền thật hoặc tiền trong game

  # ==================================================
  # 6. ĐIỂM DANH HẰNG NGÀY
  # ==================================================

  - id: daily
    aliases:
      - daily
      - điểm danh
      - quà ngày
      - quà hằng ngày
      - quangay
      - diemdanh
      - nhận quà hàng ngày

    title: Điểm Danh Hằng Ngày (/daily)

    content: |
      Mỗi 24 giờ bạn có thể nhận quà miễn phí một lần.

      Cách nhận:
      - /daily hoặc /quangay hoặc /diemdanh
      - Hoặc mở /menu → bấm icon Rương 🎁

      Quà nhận được mỗi ngày:
      - +10,000$ tiền mặt
      - 5 Kim Cương
      - 3 Táo Vàng Enchant
      - 16 Tên Lửa (Firework Rocket)
      - 16 Thịt Bò Nướng

  # ==================================================
  # 7. TÀI XỈU (SÒNG BẠC)
  # ==================================================

  - id: taixiu
    aliases:
      - tài xỉu
      - taixiu
      - tx
      - cá cược
      - sòng bạc
      - cờ bạc
      - xúc xắc
      - đặt cược

    title: Sòng Bạc Tài Xỉu (/tx)

    content: |
      Mini-game cá cược xúc xắc 1 chạm, cực dễ chơi.

      Cách chơi:
      1. Gõ /tx hoặc mở /menu → icon Vàng 🎲
      2. Chọn mức tiền cược (1K đến TẤT TAY)
      3. Bấm ĐẶT TÀI (đỏ) hoặc ĐẶT XỈU (xanh)
      4. Chờ 10 giây đếm ngược xem Action Bar
      5. Kết quả hiện to giữa màn hình!

      Luật chơi:
      - TÀI: Tổng 3 xúc xắc từ 11-18 điểm
      - XỈU: Tổng 3 xúc xắc từ 3-10 điểm
      - Tỉ lệ thắng: 1 ăn 1.8 (đã trừ 10% thuế nhà cái)
      - Giới hạn: mỗi người tối đa 1 lần / 2 giờ

  # ==================================================
  # 8. BẢO VỆ TÂN THỦ
  # ==================================================

  - id: newbie_protection
    aliases:
      - bảo vệ tân thủ
      - baove
      - protection
      - miễn pvp
      - không bị đánh
      - pvp mới vào

    title: Bảo Vệ Tân Thủ (/baove)

    content: |
      Khi lần đầu vào KhangSMP, được bảo vệ hoàn toàn khỏi PvP trong 60 phút.

      Trong thời gian bảo vệ:
      - Không ai gây sát thương được cho bạn
      - Bạn cũng không thể tấn công người khác

      Xem trạng thái:
      /baove hoặc /protection hoặc /newbie

  # ==================================================
  # 9. PVP
  # ==================================================

  - id: pvp
    aliases:
      - pvp
      - đánh nhau
      - combat
      - bị giết
      - pk

    title: PvP

    content: |
      Server có bật PvP ngoài vùng Spawn.

      Quy tắc:
      - Không được PvP trong khu vực Spawn
      - Không được PvP trong Claim của người khác
      - Tân thủ mới vào được bảo vệ 60 phút đầu
      - Bắt nạt tân thủ sẽ bị xử lý theo nội quy

  # ==================================================
  # 10. CHẶT CÂY NHANH (TIMBER)
  # ==================================================

  - id: timber
    aliases:
      - timber
      - chặt cây
      - chặt nhanh
