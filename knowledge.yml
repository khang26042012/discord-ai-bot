  title: FAQ - Câu hỏi thường gặp
  content: 'Không phá được block?

    → Bạn đang ở Spawn hoặc trong Claim của người khác.


    Không mở được rương / cửa?

    → Chưa được chủ Claim cấp quyền /containertrust hoặc /accesstrust.


    Không Claim được?

    → Claim bị chồng, ở vùng cấm, hoặc hết claim blocks. Kiểm tra: /claimslist


    Có mất đồ khi chết không?

    → CÓ. Server KHÔNG có Keep Inventory. Hãy cẩn thận!


    Bị người khác đánh khi mới vào?

    → /baove để xem thời gian bảo vệ tân thủ còn lại.


    Shop ở đâu?

    → Chưa có NPC Shop. Dùng /tx để chơi Tài Xỉu kiếm tiền!


    Cần hỗ trợ?

    → Discord: https://discord.gg/4afmVDmy2

    '
