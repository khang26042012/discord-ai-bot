  content: 'Các rank hiện tại:

    • Member   - Rank mặc định khi vào server

    • Admin    - Quản trị viên

    • Owner    - Chủ server (Phan Trọng Khang)


    Rank đặc biệt (do Admin cấp tay):

    Manager, Famous, Discord, Helper, TheEgg


    Lưu ý:

    - Rank chỉ do Owner/Admin cấp trực tiếp

    - Không thể mua Rank bằng tiền thật hoặc tiền trong game

    '
