    title: Hệ Thống Bang Hội / Đội Nhóm (/team)

    content: |
      Server sử dụng plugin BetterTeams để gắn kết anh em chiến hữu:
      - /team create <tên>   - Tạo một bang hội / team mới
      - /team invite <tên>   - Mời thành viên vào team
      - /team join <tên>     - Chấp nhận vào team
      - /team leave          - Rời khỏi team hiện tại
      - /team chat (hoặc /tc) - Chuyển sang kênh chat nội bộ team
      - /team pvp            - Bật hoặc tắt PvP giữa các thành viên trong team
      - /team info [tên]     - Xem thông tin chi tiết của team

  # ==================================================
  # 22. RESOURCE PACK SONG HÀNH PC & PE
  # ==================================================

  - id: resource_pack
    aliases:
      - resource pack
      - texture pack
      - pack
      - cài pack
      - pack radio
      - pack bedrock
      - mcpack
      - lỗi ô vuông
      - hiện icon
      - mô hình 3d

    title: Resource Pack Song Hành (PC Lunar & PE Bedrock)

    content: |
      Hệ thống Resource Pack KhangSMP hoạt động hoàn toàn tự động và đồng bộ đa nền tảng:
      • Bản PC (Java / Lunar Client):
        Tự động tải khi kết nối server (lưu trữ trên GitHub Release repo PackRadio - PikaFrostbite-Java.zip). Bao gồm đầy đủ mô hình 3D vũ khí, âm thanh 17 bài hát và font huy hiệu bitmap.
      • Bản PE (Bedrock / Điện thoại):
