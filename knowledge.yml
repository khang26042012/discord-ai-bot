  title: Tính Năng Xoa Đầu Hoạt Hình (/patpat)
  content: 'Server tích hợp tính năng PatPat xoa đầu hoạt hình siêu đáng yêu:

    - Lệnh sử dụng: /patpat <tên_người_chơi>

    - Hiệu ứng: Xuất hiện animation 5 khung hình bàn tay màu trắng (\uE300 đến \uE304)
    xoa đầu liên tục trên đầu bạn bè.

    - Bàn tay luôn quay mặt về camera người nhìn (Billboard Center), phát âm thanh
    vỗ "patpat.pat" êm tai và bắn ra các hạt tim ngọt ngào.

    - Hoạt động mượt mà 100% không lỗi trên cả Lunar Client (PC) lẫn Geyser Bedrock
    (Điện thoại) mà không bắt người chơi phải cài đặt bất kỳ bản mod nào!

    '
