  title: Cơ Chế Farm & Chăn Nuôi Trên KhangSMP
  content: 'Cơ chế farm và chăn nuôi trên KhangSMP hoàn toàn tuân theo cơ chế Minecraft
    Vanilla gốc 1.21.4 (Paper):

    - Động vật (gà, bò, cừu, heo) sinh sản và đẻ trứng tự nhiên khi được cho ăn hạt
    giống/lúa mì/cà rốt theo luật gốc của Minecraft.

    - TUYỆT ĐỐI KHÔNG CÓ "máy ấp trứng tự động", không có lệnh mua bán trứng ảo hay
    tính năng hack farm trong /menu.

    - Người chơi muốn farm trứng hoặc thực phẩm phải tự tay xây chuồng trại thủ công
    bằng phễu (hopper), nước và redstone vanilla.

    - Không sử dụng các phần mềm gian lận, auto click hay dupe đồ (hệ thống BetterAntiDupe
    sẽ phát hiện và xử lý ngay).

    '
