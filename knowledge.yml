  # ==================================================
  # 16. PLUGIN
  # ==================================================

  - id: plugins
    aliases:
      - plugin
      - plugins
      - hệ thống

    title: Plugin đang sử dụng

    content: |
      Server Paper 1.21.4, Bedrock/PE qua Geyser + Floodgate.

      Tính năng Skript tuỳ chỉnh:
      - Tài Xỉu 1 Chạm (/tx)
      - Điểm Danh Hằng Ngày (/daily)
      - Bảo Vệ Tân Thủ 60 phút (/baove)
      - Chặt Cây Nhanh (/timber)
      - 1 Người Ngủ Qua Đêm
      - Thiên Kiếp Sấm Sét (chống chửi thề)
      - Báo Cáo Vi Phạm (/report)
      - Chào Mừng Tân Thủ tự động
      - Redeem Code (/redeem)

      Plugin khác: GriefPrevention, VeinMiner, TAB, GrimAC, LuckPerms, DriveBackupV2...

  # ==================================================
  # 17. VEINMINER
  # ==================================================

  - id: veinminer
    aliases:
      - veinminer
      - đào quặng nhanh
      - vein mine
      - vm

    title: VeinMiner (Đào quặng nhanh)

    content: |
      Giữ Shift + dùng dụng cụ phù hợp đập vào quặng/gỗ để phá toàn bộ dải cùng loại.
      /veinminer toggle - Bật/tắt VeinMiner

  # ==================================================
  # 18. NGỒI / NẰM / CƯỠI ĐẦU
  # ==================================================

  - id: sit_ride
    aliases:
      - ngồi
      - nằm
      - sit
      - gsit
      - cưỡi đầu
      - rideonhead
      - leo lên đầu

    title: Ngồi, Nằm & Cưỡi Đầu

    content: |
      Ngồi / Nằm (GSit):
      - PE: Nhấn giữ vào mặt đất để ngồi; vuốt xuống để nằm
      - Java: Shift + Chuột phải vào mặt đất

      Cưỡi lên đầu người khác:
      - PE: Nhấn giữ vào người chơi khác
      - Java: Chuột phải vào người chơi khác
      - Nhấn Shift để xuống

      Chặn người khác cưỡi: /ride blacklist

  # ==================================================
  # 19. HỆ THỐNG STUDIO NHẠC (/nhac)
  # ==================================================

  - id: music_system
    aliases:
      - nhac
      - nhạc
      - /nhac
      - bat nhac
      - bạt nhạc
      - tat nhac
      - tắt nhạc
      - nghe nhac
      - bài hát
      - playlist
      - lofi
      - chill
      - studio nhac
      - am thanh
      - sound

    title: Hệ Thống Studio Nhạc KhangSMP (/nhac)

    content: |
      KhangSMP sở hữu hệ thống Studio Nhạc Lofi Chill tự động phát toàn server cực hay:
      - Tự động phát nhạc cho người chơi sau 3 giây khi vừa vào game.
      - Vòng lặp phát vô hạn (loop) đồng bộ toàn bộ người chơi, chạy ngầm mượt mà.
      - Gồm 17 bài hát chuẩn Studio Ogg Vorbis (80k bitrate):
        1. Rồi Mùa Yêu Thương Dần Đang Đến
        2. Trúc Xinh Remix Kiều Thơ
        3. Playlist Speed Up Chill
        4. Pin Dự Phòng - Dương Domic ft. Lou Hoàng
        5. Simple Love Remix - Obito x Seachains
        6. 100 Years Love - NamDuc
        7. Hoa Không Đến Vườn Demo
        8. Họa Mây Cố Giang Tình 2
        9. Thiệp Hồng Người Dưng Lofi
        10. Chuyện Đôi Ta Lofi
        11. JACK J97 - LƯU NIÊN
        12. Nắng Lung Linh - Nguyễn Thương
        13. Phải Chăng Em Đã Yêu Remix
        14. From The Start - Laufey
        15. Em Có Biết Orinn Remix
        16. Chạnh Lòng Thương Cô
        17. Lofi Chill Gaming - Lukrembo
      
      Các lệnh điều khiển:
      • /nhac           - Bật / Tắt nhanh nhạc cá nhân (toggle)
      • /nhac on (hoặc /nhac bat) - Bật nghe nhạc
      • /nhac off (hoặc /nhac tat) - Tắt nhạc ngay lập tức
      • /nhac list (hoặc /nhac ds) - Xem danh sách 17 bài hát và bài đang phát
      • /nhac playing   - Xem bài hát hiện tại và thời gian còn lại
      • /nhac next (/nhac skip) - Chuyển sang bài kế tiếp (dành cho OP/Admin)

  # ==================================================
  # 20. XOA ĐẦU HOẠT HÌNH (/patpat)
  # ==================================================

  - id: patpat_system
    aliases:
      - patpat
      - /patpat
      - xoa đầu
      - xoa dau
      - vỗ đầu
      - vuốt đầu
      - cưng nựng
      - ban tay
      - pat
      - animation tay

    title: Tính Năng Xoa Đầu Hoạt Hình (/patpat)

    content: |
      Server tích hợp tính năng PatPat xoa đầu hoạt hình siêu đáng yêu:
      - Lệnh sử dụng: /patpat <tên_người_chơi>
      - Hiệu ứng: Xuất hiện animation 5 khung hình bàn tay màu trắng (\uE300 đến \uE304) xoa đầu liên tục trên đầu bạn bè.
      - Bàn tay luôn quay mặt về camera người nhìn (Billboard Center), phát âm thanh vỗ "patpat.pat" êm tai và bắn ra các hạt tim ngọt ngào.
      - Hoạt động mượt mà 100% không lỗi trên cả Lunar Client (PC) lẫn Geyser Bedrock (Điện thoại) mà không bắt người chơi phải cài đặt bất kỳ bản mod nào!

  # ==================================================
  # 21. BANG HỘI / ĐỘI NHÓM (/team, /clan)
  # ==================================================

