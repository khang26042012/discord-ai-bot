  title: Hệ Thống Cửa Hàng /shop & Rương Bán Nhanh /sellgui
  content: 'Hệ thống Cửa Hàng mua bán vật phẩm chính thức của KhangSMP:


    1. Cách mua sắm từ Shop (/shop):

    • Gõ lệnh /shop để mở giao diện cửa hàng.

    • Chọn danh mục cần mua: Khoáng Sản, Nông Sản, Công Cụ, Vật Liệu Xây Dựng, Đồ
    Quái Rơi...

    • Có thể gõ /shop search <tên> để tìm kiếm siêu nhanh.

    • Hàng mới cập nhật: Đèn Ếch (Froglight 3 màu: Vàng, Xanh, Tím), Đạn Gió Lốc (Wind
    Charge), Que Gió (Breeze Rod).


    2. Cách bán đồ nhanh qua rương thông minh (/sellgui):

    • Gõ lệnh /sellgui để mở rương rỗng.

    • Kéo thả toàn bộ nông sản, khoáng sản, đồ thừa muốn bán vào rương.

    • Đóng rương lại (nhấn ESC hoặc dấu X) là tiền tự động cộng thẳng vào tài khoản
    kèm thông báo chi tiết!

    • Món đồ nào không bán được sẽ trả lại an toàn vào túi đồ.


    3. Cơ chế phục hồi giá thông minh (Dynamic Pricing):

    • Giá bán nông sản và khoáng sản tự động điều chỉnh theo quy luật cung cầu.

    • Cứ mỗi 3 phút, giá bán các mặt hàng sẽ tự động phục hồi tăng 2% để kích thích
    kinh tế nông dân và thợ mỏ.


    4. Lưu ý đặc biệt về Cánh Elytra:

    • Cánh Elytra chỉ có thể mua từ /shop ($1,500,000 xu).

    • Shop KHÔNG thu mua lại Cánh Elytra để chống lạm phát. Nếu muốn bán Cánh, hãy
    dùng Chợ Đen (/ah) để bán cho người chơi khác!'
