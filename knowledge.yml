  title: Hệ Thống Nhạc Nền Tự Động Toàn Server KhangSMP (/nhac)
  content: "KhangSMP sở hữu hệ thống phát nhạc nền tự động độc quyền (plugin MusicKhangSMP)\
    \ phủ sóng toàn bộ server:\n- Tự động phát nhạc xoay vòng liên tục cho toàn thể\
    \ người chơi online (bài trước hết giờ tự động sang bài kế tiếp).\n- Âm nhạc chất\
    \ lượng cao chuẩn Ogg Vorbis, đồng bộ thời gian thực cho cả người chơi Java và\
    \ Bedrock/PE.\n- Danh sách 15 bài hát cực đỉnh (hơn 62 phút nghe không ngừng nghỉ):\n\
    \  1. Tinh Vệ (Bản Hí, Hợp Xướng) [04:19]\n  2. Đáy Biển (Hải Đới) [04:15]\n \
    \ 3. Xích Linh (Lý Ngọc Cương) [04:57]\n  4. Rainy Love (DJ Remix) [03:17]\n \
    \ 5. Từ Khóa (DJ Remix) [05:03]\n  6. Biển, Đảo Và Em [00:51]\n  7. Từ Cửu Môn\
    \ Hồi Ức (Giải Ngữ Hoa) [03:50]\n  8. Thanh Y (Cổ Phong Hí Khúc) [04:10]\n  9.\
    \ Du Kinh (Du Kinh Ký) [05:58]\n  10. Lucky Go Girl [05:19]\n  11. Illusionary\
    \ Daytime x Trackmaker [02:26]\n  12. Cry For Me (Michita ft. Ami) [04:59]\n \
    \ 13. Đảo Không Người (MinhXT2nd Remix) [03:47]\n  14. Powfu - death bed (Slowed\
    \ + Reverb) [03:53]\n  15. Take Me Hand (DAISHI DANCE ft. Cécile) [05:20]\n\n\
    Các lệnh điều khiển dành cho người chơi (Member):\n• /nhac on        - Bật nghe\
    \ nhạc nền cho bản thân\n• /nhac off       - Tắt nghe nhạc nền cho bản thân (im\
    \ lặng, lưu vĩnh viễn lựa chọn)\n• /nhac check     - Xem bài hát đang phát, tiến\
    \ độ thời gian thực và thanh tiến trình trực quan\n• /nhac list      - Xem danh\
    \ sách 15 bài hát kèm thời lượng\n* Lưu ý: Người chơi thông thường không có quyền\
    \ tự ý next hoặc skip bài để tránh làm gián đoạn mọi người.\n\nCác lệnh dành cho\
    \ Admin / OP (/nhacad):\n• /nhacad on / off - Bật / Tắt hệ thống nhạc nền toàn\
    \ server\n• /nhacad next    - Chuyển ngay sang bài kế tiếp\n• /nhacad check  \
    \ - Kiểm tra trạng thái hệ thống\n• /nhacad list    - Danh sách 15 bài hát\n•\
    \ /nhacad reload  - Nạp lại cấu hình config.yml"
