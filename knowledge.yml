  title: Sàn Đấu Giá & Giao Dịch Chợ Đen (/ah, /choden)
  content: 'Sàn Giao Dịch Chợ Đen (/ah hoặc /choden) là nơi giao thương tự do giữa
    người chơi với người chơi trên KhangSMP:


    1. Cách vào xem & mua đồ:

    • Gõ /ah hoặc /choden để mở giao diện sàn giao dịch.

    • Dùng lệnh /ah search <tên> để tìm nhanh món đồ cần mua (kiếm, giáp, sách phép,
    cánh...).

    • Nhấp vào món đồ muốn mua ➔ Bấm nút ''Xác Nhận Mua'' trong Menu là đồ về túi
    ngay lập tức.


    2. Cách đăng bán đồ chuẩn 3 bước:

    • Bước 1: Cầm món đồ muốn bán trên tay chính (không để tay trống).

    • Bước 2: Gõ lệnh: /ah sell <giá_tiền> (hoặc /ah ban <giá>).

    • Bước 3 (BẮT BUỘC): Sau khi gõ lệnh, hệ thống mở ra Menu Xác Nhận. Bạn PHẢI BẤM
    VÀO NÚT ''XÁC NHẬN'' trong Menu thì món đồ mới chính thức lên sàn! (Nếu đóng Menu
    mà chưa bấm xác nhận là đồ chưa lên sàn).

    • Đồ được niêm yết trên sàn trong 48 giờ.


    3. Cách nhận tiền bán đồ:

    • Khi có người mua, hệ thống sẽ thông báo in-game.

    • Gõ lệnh /ah claim để nhận tiền vào tài khoản (thuế sàn 5% tự động khấu trừ để
    bảo vệ kinh tế máy chủ).


    4. Các lệnh quản lý tiện ích:

    • /ah items: Xem các món đồ bạn đang rao bán (có thể nhấp vào để hủy bán và lấy
    lại đồ).

    • /ah expire: Kho chứa đồ hết hạn sau 48h hoặc đồ đã hủy bán để lấy lại an toàn.

    • /ah history: Xem lịch sử các giao dịch mua bán của bản thân.


    5. Quy định:

    • Mỗi người chơi được treo tối đa 5 món đồ cùng lúc.

    • Giá niêm yết tối thiểu: $10 xu.

    • Cánh Elytra: Đã tắt bán ở /shop, chỉ có thể mua bán tự do giữa người chơi với
    nhau trên Chợ Đen (/ah)!'
