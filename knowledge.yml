- id: timber_veinminer
  title: 'Khai Thác Thần Tốc: Chặt Cây /timber & Đào Quặng VeinMiner'
  aliases:
  - timber
  - chat cay nhanh
  - veinminer
  - dao quang nhanh
  - chat cay
  - dao quang
  content: '- Chặt cây nhanh: /timber (hoặc bật sẵn) - Chỉ cần chặt 1 block gốc cây,
    toàn bộ thân cây gỗ và lá phía trên sẽ lập tức sụp đổ rớt ra, giúp tiết kiệm thời
    gian gom gỗ gấp 10 lần.

    - Đào quặng VeinMiner: Nhấn giữ phím Shift (ngồi xổm) khi đập một khối quặng,
    toàn bộ mạch quặng liền kề xung quanh (than, sắt, vàng, kim cương) sẽ vỡ ra cùng
    một lúc!'
