  # ==================================================
  # 15. VEINMINER (ĐÀO QUẶNG NHANH)
  # ==================================================

  - id: veinminer
    aliases:
      - veinminer
      - đào quặng nhanh
      - đào nhanh
      - vein mine
      - vm

    title: VeinMiner (Đào quặng nhanh)

    content: |
      Plugin hỗ trợ phá toàn bộ dải quặng hoặc khối gỗ cùng loại trong một lần đập.

      Cách sử dụng:
      - Giữ phím Sneak (Giữ Shift / Ngồi xuống) và dùng dụng cụ phù hợp (Cúp, Rìu...) đập vào quặng/gỗ.

      Lệnh cơ bản:
      /veinminer toggle    - Bật hoặc tắt tính năng VeinMiner cho bản thân

  # ==================================================
  # 16. RIDE ON HEAD (CƯỠI NGƯỜI CHƠI)
  # ==================================================

  - id: rideonhead
    aliases:
      - rideonhead
      - ride
      - cưỡi đầu
      - đội đầu
      - cưỡi người chơi

    title: RideOnHead (Cưỡi người chơi)

    content: |
      Tính năng giải trí cho phép bạn ngồi lên đầu người chơi khác.

      Cách sử dụng:
      - Chuột phải (trên Java/PC) hoặc Đè/Nhấn giữ (trên PE/Bedrock) vào người chơi khác để cưỡi lên đầu.
      - Nhấn phím Shift / Nút ngồi xuống để leo xuống.

      Lệnh cá nhân:
      /ride blacklist      - Thêm/Xóa người chơi vào danh sách cấm cưỡi lên đầu bạn

  # ==================================================
  # 17. GRIMAC (CHỐNG HACK)
  # ==================================================

  - id: grimac
    aliases:
      - grimac
      - grim
      - anticheat
      - chống hack

    title: GrimAC (Hệ thống chống Hack/Cheat)

    content: |
      Hệ thống tự động ngăn chặn các hành vi gian lận (hack/cheat) để bảo vệ server.

  # ==================================================
  # 18. NIGHT VISION (TẦM NHÌN ĐÊM)
  # ==================================================

  - id: nightvision
    aliases:
      - nightvision
      - nv
      - nhìn đêm
      - tầm nhìn đêm
      - nhìn trong tối

    title: Night Vision (Tầm nhìn đêm)

    content: |
      Tính năng hỗ trợ giúp bạn nhìn rõ mọi vật trong bóng tối hoặc dưới nước mà không cần cắm đuốc.

      Cách sử dụng:
      /nightvision on   - Bật hiệu ứng nhìn trong đêm
      /nightvision off  - Tắt hiệu ứng nhìn trong đêm
