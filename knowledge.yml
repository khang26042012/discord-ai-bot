  title: Các lệnh cơ bản
  content: '=== Menu chính ===

    /menu             - Mở bảng điều khiển nhanh (GUI)


    === Giao thương & Kinh tế ===

    /shop             - Mở Cửa Hàng mua bán vật phẩm với server

    /sellgui          - Mở rương thông minh để bán nhanh đồ thừa lấy tiền

    /ah hoặc /choden  - Mở Sàn Giao Dịch Chợ Đen giữa người chơi

    /ah sell <giá>    - Đăng bán đồ lên Chợ Đen (bắt buộc bấm nút Xác Nhận trong Menu)

    /ah claim         - Nhận tiền mặt khi bán được đồ trên Chợ Đen

    /bal              - Xem số dư tiền hiện tại trong tài khoản

    /pay <tên> <tiền> - Chuyển tiền an toàn cho người chơi khác

    /baltop           - Bảng xếp hạng phú hào giàu nhất server


    === Nhạc nền server ===

    /nhac on          - Bật nghe nhạc nền cho bản thân

    /nhac off         - Tắt nghe nhạc nền cho bản thân

    /nhac check       - Xem bài đang phát và thời gian còn lại

    /nhac list        - Xem danh sách 15 bài hát


    === Dịch chuyển ===

    /spawn            - Về Spawn

    /rtp              - Dịch chuyển ngẫu nhiên (Overworld)

    /home [tên]       - Về Home

    /homes            - Xem danh sách Home

    /sethome [tên]    - Đặt Home

    /delhome [tên]    - Xóa Home

    /back             - Quay lại vị trí vừa chết


    === TPA ===

    /tpa <tên>        - Gửi yêu cầu dịch chuyển

    /tpaccept         - Chấp nhận

    /tpdeny           - Từ chối


    === Tiện ích & Giải trí ===

    /msg <tên>        - Nhắn tin riêng

    /reply            - Trả lời người vừa nhắn

    /daily            - Nhận quà hằng ngày

    /tx               - Sòng bạc Tài Xỉu 1 chạm

    /baove            - Xem trạng thái bảo vệ tân thủ (60 phút miễn PvP)

    /report <tên> <lý do> - Báo cáo người vi phạm cho Admin

    /timber           - Bật/tắt chặt cả cây 1 nhát

    /veinminer        - Bật/tắt đào cả cụm quặng (/vm)

    /sit, /lay, /crawl - Ngồi, nằm, trườn

    /sb               - Bật/tắt bảng điểm Scoreboard'
